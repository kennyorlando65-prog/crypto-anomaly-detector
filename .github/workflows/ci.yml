name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Detection engine (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check engine api tests

      - name: Run tests
        run: pytest -q

  frontend:
    name: Dashboard (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # `npm install` rather than `npm ci`: this repository does not commit a
      # package-lock.json, and `npm ci` (and setup-node's `cache: npm`) both
      # hard-fail without one. Every version in package.json is pinned exactly,
      # so installs are still deterministic. Commit a lockfile and switch this
      # back to `npm ci` if you want transitive dependencies pinned too.
      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # The build must not need a live backend. The page handles an
          # unreachable engine by rendering a notice, so this is safe.
          NEXT_PUBLIC_API_BASE: http://127.0.0.1:8000

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
